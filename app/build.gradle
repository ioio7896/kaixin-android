plugins {
    id "com.android.application"
}

// Configure the relocated output directory before AGP resolves its generated
// default ProGuard files. Setting this after the android block leaves R8
// pointing at app/build even though all intermediates live under root/build.
layout.buildDirectory = rootProject.layout.buildDirectory.dir("offline-ime-app")

// One timestamp identifies the installed version and the exported APK.
def buildEpoch = providers.gradleProperty("apkBuildEpoch").orNull
def apkBuildTime = (buildEpoch == null ? java.time.Instant.now() : java.time.Instant.ofEpochSecond(Long.parseLong(buildEpoch)))
        .atZone(java.time.ZoneId.of("Asia/Shanghai"))
def apkVersionName = apkBuildTime.format(java.time.format.DateTimeFormatter.ofPattern("yyyyMMdd-HHmmss"))
def apkVersionCode = Math.toIntExact(apkBuildTime.toEpochSecond())

// Optional -PabiFilter=arm64-v8a speeds up local incremental builds.
// Full exports (exportDebugApks) always compile all four supported ABIs.
def allAbis = ["armeabi-v7a", "arm64-v8a", "x86", "x86_64"]
def isFullDebugExport = gradle.startParameter.taskNames.any { it.endsWith("exportDebugApks") }
def requestedAbiFilter = isFullDebugExport ? null : providers.gradleProperty("abiFilter").orNull
def activeAbis = (requestedAbiFilter == null || requestedAbiFilter.trim().isEmpty())
        ? allAbis
        : requestedAbiFilter.split(",").collect { it.trim() }.findAll { allAbis.contains(it) }
if (activeAbis.isEmpty()) {
    throw new GradleException("Unsupported abiFilter '${requestedAbiFilter}'. Valid values: ${allAbis.join(', ')}")
}

android {
    namespace = "com.example.offlineime"
    compileSdk 35
    ndkVersion = "27.2.12479018"

    defaultConfig {
        applicationId "com.example.offlineime"
        minSdk 26
        targetSdk 35
        versionCode apkVersionCode
        versionName apkVersionName
        testInstrumentationRunner "com.example.offlineime.FrontendStabilityInstrumentation"
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_static", "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
                if (activeAbis.size() < allAbis.size()) {
                    abiFilters.addAll(activeAbis)
                }
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file("src/main/cpp/handwriting/CMakeLists.txt")
            version = "3.22.1"
        }
    }

    buildFeatures {
        buildConfig = true
    }

    // Map bundled dictionary and NCNN binary model weights directly from the APK without decompression.
    androidResources { noCompress += ["dict", "bin"] }

    lint {
        checkTestSources = false
        ignoreTestSources = true
        warningsAsErrors = true
    }

    splits {
        abi {
            enable = true
            reset()
            include "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
            if (activeAbis.size() < allAbis.size()) {
                exclude(*(allAbis - activeAbis))
            }
            universalApk = (activeAbis.size() == allAbis.size())
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources = true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            // The Rust engine dictionary and lexicon notices are generated before preBuild.
            assets.srcDirs += [rootProject.layout.buildDirectory.dir("engine-assets").get().asFile]
            assets.srcDirs += [rootProject.layout.buildDirectory.dir("emoji-assets").get().asFile]
            jniLibs.srcDirs += [rootProject.layout.buildDirectory.dir("engine-jniLibs").get().asFile]
        }
    }
}

// Static-only packaging does not create or resolve JVM/device test variants.
androidComponents {
    beforeVariants(selector().all()) { variant ->
        if (providers.gradleProperty("staticOnlyBuild").orNull == "true") {
            variant.enableUnitTest = false
            variant.enableAndroidTest = false
        }
    }
}

// Keep exported debug APKs upgrade-compatible with builds from tools/build_debug.ps1.
def projectDebugKeystore = rootProject.file(".android/debug.keystore")
if (projectDebugKeystore.isFile()) {
    android.signingConfigs.debug.storeFile = projectDebugKeystore
}

def releaseSigning = [
        storeFile: providers.environmentVariable("IME_RELEASE_STORE_FILE").orNull,
        storePassword: providers.environmentVariable("IME_RELEASE_STORE_PASSWORD").orNull,
        keyAlias: providers.environmentVariable("IME_RELEASE_KEY_ALIAS").orNull,
        keyPassword: providers.environmentVariable("IME_RELEASE_KEY_PASSWORD").orNull
]
def hasReleaseSigning = releaseSigning.values().every { it != null && !it.trim().isEmpty() }
if (hasReleaseSigning) {
    def signing = android.signingConfigs.create("release") {
        storeFile = file(releaseSigning.storeFile)
        storePassword = releaseSigning.storePassword
        keyAlias = releaseSigning.keyAlias
        keyPassword = releaseSigning.keyPassword
    }
    android.buildTypes.release.signingConfig = signing
}

tasks.register("verifyReleaseSigning") {
    doLast {
        if (!hasReleaseSigning) {
            throw new GradleException("Set IME_RELEASE_STORE_FILE, IME_RELEASE_STORE_PASSWORD, IME_RELEASE_KEY_ALIAS and IME_RELEASE_KEY_PASSWORD to build a signed release.")
        }
        if (!file(releaseSigning.storeFile).isFile()) {
            throw new GradleException("IME_RELEASE_STORE_FILE does not point to a keystore file.")
        }
    }
}
tasks.configureEach { task ->
    if (task.name == "assembleRelease" || task.name == "bundleRelease") {
        task.dependsOn("verifyReleaseSigning")
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
}

// ---- Rust pinyin engine (../engine) ---------------------------------------
// dictgen compiles the text lexicon into one memory-mapped dictionary asset;
// cargo cross-compiles libkaixin_engine.so with the NDK clang linkers.
def engineDir = rootProject.file("engine")
def engineAssets = rootProject.layout.buildDirectory.dir("engine-assets")
def emojiAssets = rootProject.layout.buildDirectory.dir("emoji-assets")
def emojiSource = rootProject.file("data_sources/emoji")
def emojiGenerator = rootProject.file("tools/build_emoji_catalog.py")
def emojiOutput = emojiAssets.get().dir("emoji").asFile
def engineLibs = rootProject.layout.buildDirectory.dir("engine-jniLibs")
def allRustTargets = ["arm64-v8a": "aarch64-linux-android", "armeabi-v7a": "armv7-linux-androideabi",
                      "x86": "i686-linux-android", "x86_64": "x86_64-linux-android"]
def rustTargets = allRustTargets.findAll { abi, _ -> activeAbis.contains(abi) }
def onWindows = System.getProperty("os.name").toLowerCase(Locale.ROOT).contains("windows")
def ndkHostTag = onWindows ? "windows-x86_64"
        : System.getProperty("os.name").toLowerCase(Locale.ROOT).contains("mac") ? "darwin-x86_64" : "linux-x86_64"
def cargoHome = System.getenv("CARGO_HOME") ?: new File(System.getProperty("user.home"), ".cargo").path
def rustupHome = System.getenv("RUSTUP_HOME") ?: new File(System.getProperty("user.home"), ".rustup").path
def cargoExecutable = new File(cargoHome, "bin/cargo" + (onWindows ? ".exe" : "")).with { it.isFile() ? it.path : "cargo" }
def engineSources = fileTree(engineDir) { include "src/**", "Cargo.toml", "Cargo.lock" }

tasks.register("generateEmojiCatalog", Exec) {
    inputs.dir(emojiSource)
    inputs.file(emojiGenerator)
    outputs.dir(emojiOutput)
    commandLine "python", emojiGenerator.absolutePath, emojiSource.absolutePath, emojiOutput.absolutePath
}

tasks.register("buildEngineDictionary", Exec) {
    dependsOn("generateEmojiCatalog")
    def output = engineAssets.get().file("engine/kaixin.dict").asFile
    inputs.files(fileTree("../lexicon") { include "**/*.txt" })
    inputs.files(fileTree("src/main/assets/lexicon-corrections"))
    inputs.files(fileTree("src/main/assets/opencc") { include "*.txt" })
    inputs.files(fileTree("src/main/assets/stroke") { include "*.txt" })
    inputs.file("../data_sources/desktop_single_char_readings.txt")
    inputs.file("src/main/assets/language-model/collocations.tsv")
    inputs.files(engineSources)
    inputs.file(new File(emojiOutput, "catalog.tsv"))
    outputs.file(output)
    workingDir engineDir
    commandLine cargoExecutable, "run", "--release", "--quiet", "--bin", "dictgen", "--",
            rootProject.projectDir.absolutePath, output.absolutePath, new File(emojiOutput, "catalog.tsv").absolutePath
}

// License and source notices shown in settings; the word lists themselves are compiled.
tasks.register("copyLexiconNotices", Copy) {
    from("../lexicon") { include "**/*.md" }
    into(engineAssets)
}

def engineLibraryTasks = rustTargets.collect { abi, triple ->
    tasks.register("buildEngine_" + abi.replace("-", "_"), Exec) {
        inputs.files(engineSources)
        outputs.file(new File(engineDir, "target/${triple}/release/libkaixin_engine.so"))
        workingDir engineDir
        doFirst {
            def clang = (triple == "armv7-linux-androideabi" ? "armv7a-linux-androideabi" : triple) +
                    "26-clang" + (onWindows ? ".cmd" : "")
            def linker = new File(android.ndkDirectory, "toolchains/llvm/prebuilt/${ndkHostTag}/bin/${clang}")
            if (!linker.isFile()) throw new GradleException("NDK linker not found: ${linker}")
            def key = triple.toUpperCase(Locale.ROOT).replace("-", "_")
            environment "CARGO_TARGET_${key}_LINKER", linker.absolutePath
            // Paths can survive stripping in panic messages and dependency metadata.
            environment "CARGO_ENCODED_RUSTFLAGS", [
                    "-C", "link-arg=-Wl,-z,max-page-size=16384",
                    "-C", "link-arg=-Wl,-z,common-page-size=16384",
                    "--remap-path-prefix=${rootProject.projectDir.absolutePath}=.",
                    "--remap-path-prefix=${new File(cargoHome).absolutePath}=cargo",
                    "--remap-path-prefix=${new File(rustupHome).absolutePath}=rustup"
            ].join("\u001f")
        }
        commandLine cargoExecutable, "build", "--release", "--quiet", "--lib", "--target", triple
    }
}

tasks.register("buildEngineLibraries", Copy) {
    dependsOn(engineLibraryTasks)
    rustTargets.each { abi, triple ->
        from(new File(engineDir, "target/${triple}/release/libkaixin_engine.so")) { into(abi) }
    }
    into(engineLibs)
}
tasks.named("preBuild").configure {
    dependsOn("buildEngineDictionary", "copyLexiconNotices", "buildEngineLibraries")
}

// Packaging integrity only: do not run recognition or code tests here.
tasks.register("verifyHandwritingAssets") {
    def expected = [
        "model.ncnn.param": "8c4d0e594d8a4644fb97411d2b6335f55fed2e1b37057bc88fced724295902a3",
        "model.ncnn.bin": "86a4802e3c8b2ddf1180f3de361546517d708674381e58b3d10b766dc8fba49e",
        "charset.json": "31f5700027c8692122cec5281d12c6382506b36d56075331cd73718f624d4ed2",
        "extended/PP_OCRv5_mobile_rec.ncnn.param": "f52a6586ac3338d8c350db0c9f3c55ff2ecd3763327f9bc7f0efc091f8a63e74",
        "extended/PP_OCRv5_mobile_rec.ncnn.bin": "49d9907a55ba20fa6637f9f788f66ab00793bc8ce57a733a09dbe86b9a2e3db0",
        "extended/characters.json": "3576fbef951b52f0e9f4126286c54823b8612c86fabda10702b77cfe51438381"
    ]
    inputs.files(expected.keySet().collect { file("src/main/assets/handwriting/${it}") })
    doLast {
        expected.each { name, checksum ->
            def asset = file("src/main/assets/handwriting/${name}")
            if (!asset.isFile()) throw new GradleException("Missing bundled handwriting asset: ${name}")
            def digest = java.security.MessageDigest.getInstance("SHA-256")
            asset.withInputStream { stream ->
                byte[] buffer = new byte[16384]
                int count
                while ((count = stream.read(buffer)) != -1) digest.update(buffer, 0, count)
            }
            if (digest.digest().encodeHex().toString() != checksum)
                throw new GradleException("Bundled handwriting asset checksum mismatch: ${name}")
        }
    }
}
tasks.named("preBuild").configure { dependsOn("verifyHandwritingAssets") }

tasks.register("verifySpeechAssets") {
    def directory = file("src/main/assets/speech")
    def manifest = new File(directory, "manifest.json")
    inputs.files(fileTree(directory))
    doLast {
        def entries = new groovy.json.JsonSlurper().parse(manifest).sha256
        entries.each { name, checksum ->
            def asset = new File(directory, name)
            if (!asset.isFile()) throw new GradleException("Missing bundled speech asset: ${name}")
            def digest = java.security.MessageDigest.getInstance("SHA-256")
            asset.withInputStream { stream ->
                byte[] buffer = new byte[16384]
                int count
                while ((count = stream.read(buffer)) != -1) digest.update(buffer, 0, count)
            }
            if (digest.digest().encodeHex().toString() != checksum)
                throw new GradleException("Bundled speech asset checksum mismatch: ${name}")
        }
    }
}
tasks.named("preBuild").configure { dependsOn("verifySpeechAssets") }

// Export only complete outputs from this invocation. Version, file name and checksums
// share one Beijing timestamp; universal and ARM64 packages use the same signing key.
tasks.register("exportDebugApks") {
    dependsOn("assembleDebug", "lintDebug")
    doLast {
        def apkDir = layout.buildDirectory.dir("outputs/apk/debug").get().asFile
        def metadata = new groovy.json.JsonSlurper().parse(new File(apkDir, "output-metadata.json"))
        def exported = []
        ["universal", "arm64-v8a"].each { abi ->
            def output = metadata.elements.find { item ->
                abi == "universal" ? item.filters.isEmpty() : item.filters.any { it.filterType == "ABI" && it.value == abi }
            }
            if (output == null || output.versionName != apkVersionName || output.versionCode != apkVersionCode)
                throw new GradleException("Missing or stale debug output: ${abi}")
            def source = new File(apkDir, output.outputFile)
            def name = abi == "universal" ? "kaixin-android-debug-${apkVersionName}.apk"
                    : "kaixin-android-arm64-debug-${apkVersionName}.apk"
            def target = new File(rootProject.projectDir, name)
            java.nio.file.Files.copy(source.toPath(), target.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            def digest = java.security.MessageDigest.getInstance("SHA-256")
            target.withInputStream { stream ->
                byte[] buffer = new byte[1024 * 1024]; int count
                while ((count = stream.read(buffer)) != -1) digest.update(buffer, 0, count)
            }
            exported.add([file: name, abi: abi, versionName: apkVersionName, versionCode: apkVersionCode,
                          bytes: target.length(), sha256: digest.digest().encodeHex().toString()])
        }
        def checksum = new File(rootProject.projectDir, "kaixin-android-debug-${apkVersionName}.sha256")
        checksum.setText(exported.collect { "${it.sha256}  ${it.file}" }.join("\n") + "\n", "UTF-8")
        def report = rootProject.layout.buildDirectory.file("debug-export.json").get().asFile
        report.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(exported)), "UTF-8")
        logger.lifecycle("Exported timestamped debug APKs: ${exported.collect { it.file }}")
    }
}

// Gradle's Windows test worker can misdecode non-ASCII paths in its generated
// @argfile. Route the test classpath through an ASCII-path manifest JAR so
// tests also run when the checkout directory contains Chinese characters.
tasks.withType(Test).configureEach { testTask ->
    if (System.getProperty("os.name").toLowerCase(Locale.ROOT).contains("windows")
            && projectDir.absolutePath.find(/[^\x00-\x7F]/)) {
        doFirst {
            def originalClasspath = testTask.classpath.files
            def projectHash = Integer.toHexString(rootProject.projectDir.absolutePath.hashCode())
            def classpathJar = new File(
                    System.getProperty("java.io.tmpdir"),
                    "offline-ime-${projectHash}-${testTask.name}-classpath.jar")

            def manifest = new java.util.jar.Manifest()
            manifest.mainAttributes.put(java.util.jar.Attributes.Name.MANIFEST_VERSION, "1.0")
            manifest.mainAttributes.put(
                    java.util.jar.Attributes.Name.CLASS_PATH,
                    originalClasspath.collect { it.toURI().toASCIIString() }.join(" "))
            classpathJar.withOutputStream { output ->
                new java.util.jar.JarOutputStream(output, manifest).close()
            }
            testTask.classpath = files(classpathJar)
        }
    }
}
